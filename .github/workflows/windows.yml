name: SmartNotch Windows

on:
  workflow_dispatch:
  push:
    paths: ['windows/**', 'scripts/stage_windows_release.py', 'scripts/release_assets.py', 'scripts/release_config.py', 'release.json', 'RELEASE_NOTES.md', 'Assets/SmartNotchLogo.png', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'scripts/stage_windows_release.py', 'scripts/release_assets.py', 'scripts/release_config.py', 'release.json', 'RELEASE_NOTES.md', 'Assets/SmartNotchLogo.png', '.github/workflows/windows.yml']

permissions:
  contents: read

jobs:
  installer-build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package SmartNotch
        shell: pwsh
        run: |
          $config = Get-Content release.json -Raw | ConvertFrom-Json
          if ($config.updateBaseURL) {
            ./windows/publish.ps1 -Runtime ${{ matrix.rid }}
          } else {
            ./windows/publish.ps1 -Runtime ${{ matrix.rid }} -Development
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SmartNotch-${{ matrix.rid }}
          path: |
            dist/updates/windows/${{ matrix.rid }}/**
            dist/development/${{ matrix.rid }}/**
            dist/github-release/**
          if-no-files-found: error
